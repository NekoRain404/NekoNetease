name: Linux system dependencies
description: The development packages Slint/FemtoVG, ALSA, D-Bus, Wayland and libmpv are built against.
runs:
  using: composite
  steps:
    - shell: bash
      run: |
        sudo apt-get update -qq
        sudo apt-get install -y -qq \
          libdbus-1-dev libasound2-dev libxkbcommon-dev libfontconfig1-dev \
          libfreetype-dev libwayland-dev libssl-dev pkg-config libmpv-dev
